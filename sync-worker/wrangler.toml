# The Worker's name is the first label of its hostname:
#   https://sync.stonetop-wiki.workers.dev
name = "sync"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Origins allowed to call the Worker from a browser. The hosted wiki, plus
# "null" — which is what a page opened straight off a disk sends. A null
# origin is only ever answered for the GM token (see ALLOW_NULL_ORIGIN_GM in
# src/shared.js); the GM is the one who opens the wiki from Dropbox.
[vars]
ALLOWED_ORIGINS = "https://stonetop-wiki.github.io"
# TOMBSTONE_TTL_MS can be set here to override how long deletions' tombstone
# rows are kept before the sweep (default 30 days, src/shared.js). The
# compaction test suite runs its own worker with it at 0.

# One object per campaign, holding that campaign's SQLite storage and its open
# WebSockets; one per address for the rate limit on campaign creation. There is
# no shared database any more — see src/campaign.js.
[[durable_objects.bindings]]
name = "CAMPAIGN"
class_name = "Campaign"

[[durable_objects.bindings]]
name = "RATE_LIMIT"
class_name = "RateLimiter"

# SQLite-backed classes: the only kind the Workers Free plan allows, and the
# kind that gives each object its own SQL storage.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Campaign", "RateLimiter"]
