# Publishes the wiki to the org's user-page repo,
# stonetop-wiki/stonetop-wiki.github.io, which serves it at the domain root:
#   https://stonetop-wiki.github.io/marshedge.html
#
# Only tracked files are deployed: the built wiki (book text is CC BY-SA 4.0)
# and its chrome. Book artwork (images/maps/) is gitignored and never published.
# Stonetop_Wiki/sites/ holds only redirects to the adventure sites' own site.
name: Deploy site

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Assemble site
        # The wiki's own generated index.html is the site root. Book artwork is
        # never in the tree (built without --maps), so everything tracked under
        # Stonetop_Wiki/ is publishable.
        run: |
          mkdir -p _site
          cp -r Stonetop_Wiki/. _site/
          touch _site/.nojekyll

      - name: Publish to stonetop-wiki.github.io
        env:
          DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          cd _site
          git init -q -b main
          git config user.name "stonetop-wiki-generator"
          git config user.email "actions@github.com"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA::7} from ${GITHUB_REPOSITORY}"
          git push -qf git@github.com:stonetop-wiki/stonetop-wiki.github.io.git main
